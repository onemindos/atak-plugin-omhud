name: Build OMHud APK

on:
  push:
    branches: [main]
    paths:
      - 'main.py'
      - 'buildozer.spec'
      - 'requirements.txt'
      - '.github/workflows/build.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"

      - name: Install build prerequisites
        run: |
          brew install autoconf automake libtool pkg-config

      - name: Install Python deps
        run: |
          pip install Cython buildozer python-for-android

      - name: Patch p4a recipes (Python 3.11)
        run: |
          P4A_SITE=$(python3 -c "import site; print(site.getsitepackages()[0])")
          sed -i '' 's/version = "3\.14\.2"/version = "3.11.13"/' \
            "$P4A_SITE/pythonforandroid/recipes/hostpython3/__init__.py" || true
          sed -i '' "s/version = '3\.14\.2'/version = '3.11.13'/" \
            "$P4A_SITE/pythonforandroid/recipes/python3/__init__.py" || true

      - name: Patch android recipe (no-isolation)
        run: |
          P4A_SITE=$(python3 -c "import site; print(site.getsitepackages()[0])")
          RECIPE="$P4A_SITE/pythonforandroid/recipes/android/__init__.py"
          sed -i '' 's/hostpython_prerequisites = \["Cython>=0.29,<3.1"\]/hostpython_prerequisites = ["Cython>=0.29,<3.1"]\n    extra_build_args = ["--no-isolation"]/' "$RECIPE" || true

      - name: Build APK
        env:
          ANDROID_SDK_ROOT: ${{ env.ANDROID_HOME }}
        run: |
          python3 -m pythonforandroid.toolchain apk \
            --private . \
            --package org.onemindos.omhud \
            --name OMHud \
            --version 0.1.0 \
            --bootstrap sdl2 \
            --requirements kivy==2.3.0,nats-py \
            --permission CAMERA \
            --permission INTERNET \
            --android-api 33 \
            --minsdk 24 \
            --allow-minsdk-ndkapi-mismatch \
            --arch arm64-v8a \
            --debug

      - name: Collect APK
        run: |
          mkdir -p dist
          find . -name "*.apk" -exec cp {} dist/omhud-debug.apk \;

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: omhud-apk
          path: dist/omhud-debug.apk

      - name: Release APK
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.1.0
          name: OMHud v0.1.0
          files: dist/omhud-debug.apk
          draft: false
          prerelease: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
